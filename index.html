<head>

<!-- Моя техническая база, версия 1.26 -->
<style>
:root{--bg:#ECEFF3;--surf:#fff;--ink:#17202B;--mut:#5C6877;--line:#D3D9E1;--acc:#245B8F;--accink:#fff;--star:#D99A00;--danger:#B3352B;--key:#F6F7F9;--mark:#FFE9A8;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#11161C;--surf:#1A212A;--ink:#E7ECF2;--mut:#98A4B3;--line:#2B3541;--acc:#6EA6DA;--accink:#0C1620;--star:#F0B429;--danger:#FF8A80;--key:#232C37;--mark:#5A4A12;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.4 system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:96px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--surf);border-bottom:1px solid var(--line)}
.row1{display:flex;gap:8px;align-items:center;padding:8px 10px}
.search{flex:1;position:relative}
.search input{width:100%;padding:10px 38px 10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem}
.search .clr{position:absolute;right:2px;top:2px;bottom:2px;width:36px;border:0;background:none;color:var(--mut);font-size:20px;display:none}
.search.has .clr{display:block}
.top .row1{padding:2px 10px 8px}
.row0{display:flex;align-items:center;gap:2px;padding:2px 6px 0 14px}
.ttl{flex:1;min-width:0;font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn[hidden],.sb[hidden]{display:none}
.ibtn svg,.tdrop svg{display:block;margin:auto}
main.wide{max-width:var(--wmain,1500px)}
main.m-grid.fc .items.root,main.m-grid.fc .gb{display:block;column-width:260px;column-gap:8px}
main.m-grid.fc .card{break-inside:avoid;margin-bottom:8px}
main.m-grid.fc .gblock,main.m-grid.fc .gempty{column-span:all}
.cpyb{border:0;background:none;padding:3px 4px;border-radius:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;max-width:100%}
.cpyb:hover,.cpyb:focus-visible{background:var(--bg);outline:1px solid var(--line)}
.vw .cmd .cpyb{flex:1;min-width:0}
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.selbox{flex:none;display:flex;align-items:center;padding:4px 8px 4px 0}
.selbox input{width:22px;height:22px;accent-color:var(--acc)}
.card.sel{outline:2px solid var(--acc)}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:19;background:var(--surf);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.18);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#selbar[hidden]{display:none}
.sb1,.sb2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sb1{margin-bottom:6px}.sb1 b{flex:1}
body.selon{padding-bottom:170px}
body.selon #toast,body.selon #top{bottom:150px}
.ghost.multi::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;background:var(--acc);color:var(--accink);border-radius:999px;min-width:24px;height:24px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.cmprev{margin-left:8px;font:calc(.88rem*var(--cm-k,1)) ui-monospace,Consolas,monospace;color:var(--cm-tx,inherit);background:var(--key);border:var(--cm-bw,1px) solid var(--cm-bd,var(--line));border-radius:4px;padding:0 4px}
.kbprev{display:inline-flex;align-items:center;gap:3px;margin-left:8px}
.sizestep{display:flex;align-items:center;gap:12px;margin:4px 0 8px}.sizestep span{min-width:60px;text-align:center;font-weight:600}
#updbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:85;background:var(--acc);color:var(--accink);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);box-shadow:0 4px 16px rgba(0,0,0,.3);font-weight:600}
#updbar[hidden]{display:none}
#updbar .btn{background:var(--surf);color:var(--ink);border-color:transparent}
body.selon #updbar{bottom:160px}
.swr{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.sw{width:38px;height:38px;border-radius:999px;border:2px solid var(--line);padding:0}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.sw.cu{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden}
.sw.cu input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.acopy{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px;background:var(--surf)}
.acopy small{display:block;color:var(--mut)}
.fld select{width:100%}
.sech{display:flex;align-items:center;gap:6px;margin:16px 2px 8px}
.sech:first-child{margin-top:4px}
.sech .sec{margin:0}
.foldb{border:0;background:none;padding:6px 0;font-size:.95rem;font-weight:650;display:flex;gap:6px;align-items:baseline;text-align:left}
.archsec{margin-top:22px;padding-top:4px;border-top:1px dashed var(--line)}
.mv.off{opacity:.4;text-decoration:line-through}
.favbar{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.9rem;margin:2px 2px 4px}
.favbar select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:.9rem}
.colsloose{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.colsgrid{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:14px;align-items:start}
.colx{display:flex;flex-direction:column;gap:14px;min-width:0}
main.m-grid .items.root,main.m-grid .gb{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
main.m-grid .gblock,main.m-grid .gempty{grid-column:1/-1}
.vh{margin:14px 0 6px;font-size:.8rem;color:var(--mut);font-weight:600}
.vh:first-child{margin-top:0}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.orow{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.orow.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.orow small{display:block;color:var(--mut);margin-top:2px}
.ibtn.on{background:var(--acc);color:var(--accink)}
.sb{flex:none;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 10px;font-size:.9rem;color:var(--mut)}
.sb.on{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:600}
.tabrow{display:flex;align-items:flex-end;gap:4px;padding:0 10px 0 8px}
.tabrow .tabs{flex:1;min-width:0;padding:0}
.tdrop{flex:none;border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:8px 8px 0 0;width:34px;height:37px;color:var(--ink);font-size:1rem;padding:0}
.resline{color:var(--mut);font-size:.9rem;margin:2px 2px 10px}
.rhint{display:flex;gap:8px;align-items:center;background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:.88rem;color:var(--mut)}
.rhint span{flex:1}
.ibtn{border:0;background:none;width:40px;height:40px;border-radius:8px;font-size:20px;line-height:1;color:var(--ink)}
.ibtn:hover{background:var(--bg)}
.scope{display:flex;gap:6px;padding:0 10px 8px;font-size:0.875rem;align-items:center;color:var(--mut)}
.seg{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;font-size:0.875rem}
.seg.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);border-bottom:0;background:var(--bg);padding:8px 14px;border-radius:8px 8px 0 0;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--surf);color:var(--ink);font-weight:650;box-shadow:inset 0 -3px 0 var(--acc)}
.chip.misc{border-style:dashed}
main{max-width:var(--wmain,860px);margin:0 auto;padding:12px 10px}
.tb{display:flex;align-items:center;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.tb h2{margin:0;font-size:1.25rem;font-weight:650}
.cnt{color:var(--mut);font-size:.85rem}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:9px 14px;font-weight:550}
.btn:hover{border-color:var(--mut)}
.btn.sm{padding:5px 11px;font-size:.9rem}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.dng{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.lnk{border:0;background:none;color:var(--acc);padding:5px 8px}
.btn:disabled{opacity:.45;cursor:default}
.items{display:flex;flex-direction:column;gap:8px}
.gblock{margin-top:2px}
.gh{display:flex;align-items:center;gap:6px;margin:0;padding:3px 6px 3px 10px;background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px}
.gh.dropin{outline:2px solid var(--acc)}
.gb{margin:8px 0 6px 12px;padding-left:10px;border-left:2px solid var(--line)}
.gadd{border:1px solid var(--line);background:var(--bg);width:36px;height:36px;flex:none;border-radius:8px;font-size:24px;line-height:1;color:var(--acc)}
.gempty{padding:8px 4px}
.dragging{opacity:.35}
@media(max-width:699px){
  html.lock,html.lock body{overflow:hidden}
  .sheet.fs{height:100%;max-height:100%;border-radius:0}
  .sheet.fs .sh-head{padding-top:4px;padding-bottom:4px}
  .sheet.fs .sheet-body{padding:12px 14px}
  .sheet.fs .sh-foot{padding:8px 12px;gap:6px}
  .sheet.fs .sh-foot .btn{padding:9px 12px}
}
.fg{display:inline-block;font-size:.72rem;font-weight:600;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.sec{font-size:.95rem;font-weight:650;margin:18px 2px 8px}
.sec:first-child{margin-top:4px}
.secempty{margin:0 2px 6px}
.ghost{position:fixed;z-index:90;pointer-events:none;margin:0;opacity:.92;box-shadow:0 8px 22px rgba(0,0,0,.35);background:var(--surf)}
.dropline{position:fixed;height:3px;background:var(--acc);border-radius:2px;z-index:89;pointer-events:none;display:none}
.rootend{border:2px dashed var(--line);border-radius:8px;text-align:center;color:var(--mut);padding:16px 10px;margin-top:12px;font-size:.9rem}
.gh .gt{flex:1;min-width:0;border:0;background:none;padding:8px 0;font-weight:650;font-size:1rem;display:flex;gap:6px;align-items:baseline;text-align:left;overflow-wrap:anywhere}
.gh.plain{color:var(--mut);font-size:.9rem}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:var(--cpad,10px) 10px var(--cpad,10px) 12px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;transition:transform .15s}
.card:hover{border-color:var(--mut)}
.c-main{flex:1;min-width:0}
.c-title{font-weight:650;overflow-wrap:anywhere}
.c-keys{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.plus{color:var(--mut);font-size:var(--kb-fs,.82rem)}
kbd{font:var(--kb-fw,600) var(--kb-fs,.82rem) ui-monospace,Consolas,"Courier New",monospace;color:var(--kb-tx,var(--ink));background:var(--key);border:1px solid var(--kb-bd,var(--line));border-bottom-width:var(--kb-bw,2px);border-radius:5px;padding:.1em .5em}
.txt .cpyb,.c-desc .cpyb{padding:0 1px;display:inline;vertical-align:baseline}
.c-cmd{font:var(--cm-fw,400) calc(.85rem*var(--cm-k,1)) ui-monospace,Consolas,monospace;color:var(--cm-ct,var(--mut));margin-top:4px;overflow-wrap:anywhere}
.c-desc{color:var(--mut);font-size:.92rem;margin-top:3px;display:-webkit-box;-webkit-line-clamp:var(--cl,3);-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap}
.c-loc{font-size:.8rem;color:var(--mut);margin-top:5px}
.c-act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
mark{background:var(--mark);color:inherit;border-radius:2px}
.star{border:0;background:none;font-size:22px;line-height:1;width:36px;height:36px;color:var(--mut);border-radius:8px;flex:none}
.star.on{color:var(--star)}
.grip{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:grab;touch-action:none;user-select:none;font-size:20px}
.mv{border:1px solid var(--line);background:none;border-radius:6px;width:32px;height:32px;flex:none}
.card.drag,.row.drag{transition:none;position:relative;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:.95}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
#fab{position:fixed;right:16px;bottom:16px;width:58px;height:58px;border-radius:16px;border:0;background:var(--acc);color:var(--accink);font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:15;display:none}
#top{position:fixed;left:16px;bottom:16px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:15;display:none}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:80;display:none;background:#1F2933;color:#fff;border-radius:10px;padding:8px 8px 8px 16px;align-items:center;gap:10px;max-width:calc(100% - 24px);box-shadow:0 4px 16px rgba(0,0,0,.35)}
#toast button{border:0;background:none;color:#8CC4FF;font-weight:650;padding:8px 10px}
#banner .bn{margin:10px auto 0;max-width:var(--wbn,840px);background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#banner .bn.err{border-left-color:var(--danger)}
#banner .bn span{flex:1;min-width:200px}
.ov{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:rgba(10,15,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.ov.center{align-items:center;z-index:60}
.sheet{background:var(--surf);width:100%;max-width:var(--wsheet,680px);max-height:92vh;max-height:92dvh;border-radius:14px 14px 0 0;display:flex;flex-direction:column}

.sheet{position:relative}
.dots{border:0;background:none;width:36px;height:36px;flex:none;border-radius:8px;font-size:22px;line-height:1;color:var(--mut);letter-spacing:1px}
.dots:hover{background:var(--bg)}
.sh-x{position:absolute;top:4px;right:4px;z-index:2;background:var(--surf)}
.vw .tt{padding-right:40px}
.sh-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
.sh-head h3{flex:1;margin:0;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow:auto;padding:14px 16px;flex:1}
.sh-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.dlg{background:var(--surf);border-radius:12px;padding:18px;width:calc(100% - 28px);max-width:440px;max-height:90vh;overflow:auto}

.dbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.fld{margin-bottom:12px}

.fld input,.fld textarea,.fld select,.addrow input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem}
.fld textarea{resize:vertical;min-height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.err{color:var(--danger);margin:4px 0}

.vw .tt{font-size:1.2rem;font-weight:650;margin:0;overflow-wrap:anywhere}
.vw .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.vw .cmd{display:flex;gap:8px;align-items:flex-start}

span.sz-p1{font-size:1.3em}span.sz-p2{font-size:1.7em;line-height:1.2}span.sz-m1{font-size:.85em}span.sz-m2{font-size:.7em}

<script>
'use strict';
/* ===== Константы и состояние ===== */
const APP_VERSION='1.26';
const KEY='techbase_v1', BKEY='techbase_v1_backup', AKEY='techbase_v1_auto';
const DEF_TABS=['Windows','SolidWorks','Excel','AutoCAD','Inventor','Chrome','Компьютер / ноутбук','Оргтехника'];
const FIELDS=[['title','Название'],['hotkey','Горячая клавиша'],['command','Команда'],['desc','Описание'],['steps','Инструкция'],['note','Примечание']];
const DAY=86400000;
let S, view='tab', curTab=null, scope='tab', inclArch=false, q='', reorder=false, storageFailed=false, corruptFound=false, stack=[], curDirty=null;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
const pl=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return f[(a>10&&a<20)?2:b>1&&b<5?1:b===1?0:2]};
const ymd=()=>new Date().toISOString().slice(0,10);
const fmt=t=>new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

/* ===== Данные ===== */
function defaults(){
  return {app:'tech-base',format:1,
    tabs:DEF_TABS.map(n=>({id:uid(),name:n})),groups:[],entries:[],
    settings:{firstRun:Date.now(),lastExport:null,lastImport:null,remind:true,snoozeUntil:0,lastTab:null}};
}
function validate(d,strictApp){
  if(!d||typeof d!=='object'||Array.isArray(d))return 'неверная структура файла';
  if(strictApp&&d.app!=='tech-base')return 'это не файл экспорта «Моей технической базы»';
  if(strictApp&&(typeof d.format!=='number'||d.format>1))return 'неподдерживаемая версия формата';
  for(const k of ['tabs','groups','entries'])if(!Array.isArray(d[k]))return 'отсутствует раздел «'+k+'»';
  const ids=new Set(),tabIds=new Set(),grp=new Map();
  for(const t of d.tabs){if(!t||typeof t.id!=='string'||!t.id||ids.has('t'+t.id))return 'ошибка во вкладках';ids.add('t'+t.id);tabIds.add(t.id);if(t.name!=null&&typeof t.name!=='string')return 'ошибка в названии вкладки'}
  for(const g of d.groups){if(!g||typeof g.id!=='string'||!g.id||ids.has('g'+g.id))return 'ошибка в группах';ids.add('g'+g.id);if(!tabIds.has(g.tabId))return 'группа ссылается на несуществующую вкладку';grp.set(g.id,g.tabId)}
  const gpar=new Map(d.groups.map(g=>[g.id,g.parentId||null]));
  for(const g of d.groups){
    if(g.status&&!['active','archive','trash'].includes(g.status))return 'неизвестный статус группы';
    if(g.parentId){if(!grp.has(g.parentId))return 'подгруппа ссылается на несуществующую группу';if(grp.get(g.parentId)!==g.tabId)return 'подгруппа и её родитель находятся в разных вкладках'}
    let p=g.parentId,k=0;while(p){if(++k>d.groups.length)return 'циклическая вложенность групп';p=gpar.get(p)}
  }
  for(const e of d.entries){
    if(!e||typeof e.id!=='string'||!e.id||ids.has('e'+e.id))return 'ошибка в записях';ids.add('e'+e.id);
    for(const [k] of FIELDS)if(e[k]!=null&&typeof e[k]!=='string')return 'поле «'+k+'» должно быть текстом';
    if(e.status&&!['active','archive','trash'].includes(e.status))return 'неизвестный статус записи';
    for(const k of ['keylist','cmdlist']){if(e[k]!=null){if(!Array.isArray(e[k]))return 'список «'+k+'» должен быть массивом';for(const i of e[k])if(!i||typeof i!=='object'||(i.a!=null&&typeof i.a!=='string')||(i.b!=null&&typeof i.b!=='string'))return 'ошибка в списке «'+k+'»'}}
    if(e.status!=='trash'){
      if(!tabIds.has(e.tabId))return 'запись ссылается на несуществующую вкладку';
      if(e.groupId&&grp.get(e.groupId)!==e.tabId)return 'запись ссылается на несуществующую группу';
    }
  }
  return null;
}
function vset(){const st=S.settings;if(!st.view)st.view={mode:'one',cols:3,profile:'auto',fill:'rows'};if(!st.view.fill)st.view.fill='rows';if(!st.view.wm)st.view.wm='auto';if(!st.view.ws)st.view.ws='auto';if(!st.view.loose)st.view.loose='top';return st.view}
const WM=[['auto','По режиму'],['700','700'],['860','860'],['1000','1000'],['1200','1200'],['1500','1500'],['full','Во всю ширину окна']];
const WS=[['auto','Стандартная'],['560','560'],['680','680'],['800','800'],['960','960'],['1200','1200'],['full','Во всю ширину окна']];
function applyWidths(){
  if(typeof S==='undefined'||!S)return;
  const r=document.documentElement.style,v=vset(),pc=profile()==='pc';
  const set=(n,x)=>x==null?r.removeProperty(n):r.setProperty(n,x);
  if(pc&&v.wm==='full'){set('--wmain','none');set('--wbn','none')}
  else if(pc&&/^\d+$/.test(v.wm)){set('--wmain',v.wm+'px');set('--wbn',(+v.wm-20)+'px')}
  else{set('--wmain',null);set('--wbn',null)}
  if(pc&&v.ws==='full')set('--wsheet','none');
  else if(pc&&/^\d+$/.test(v.ws))set('--wsheet',v.ws+'px');
  else set('--wsheet',null);
}
window.addEventListener('resize',()=>{try{applyWidths()}catch(e){}});
function fset(){const st=S.settings;if(!st.favUI)st.favUI={n:10,cre:false,mod:false};return st.favUI}
let favOrd=false;
let selMode=false,selCtx=null,lpFired=false;const sel=new Set();
function profile(){const p=vset().profile;return p==='pc'||p==='phone'?p:(window.innerWidth>=700?'pc':'phone')}
function effMode(){return profile()==='pc'&&!reorder?vset().mode:'one'}
const lst=x=>Array.isArray(x)?x.filter(i=>i&&typeof i==='object').map(i=>({a:String(i.a||''),b:String(i.b||'')})):[];
function normalize(d,keep){
  const s={app:'tech-base',format:1,tabs:[],groups:[],entries:[],
    settings:keep||Object.assign({firstRun:Date.now(),lastExport:null,remind:true,snoozeUntil:0,lastTab:null},d.settings||{})};
  s.tabs=d.tabs.map(t=>({id:String(t.id),name:String(t.name||'Без названия'),arch:t.arch==='hide'?'hide':'show',archOpen:!!t.archOpen}));
  s.groups=d.groups.map((g,idx)=>({id:String(g.id),tabId:String(g.tabId),parentId:g.parentId?String(g.parentId):null,name:String(g.name||'Группа'),collapsed:!!g.collapsed,status:['active','archive','trash'].includes(g.status)?g.status:'active',bundle:g.bundle?String(g.bundle):null,meta:g.meta&&typeof g.meta==='object'?g.meta:null,o:typeof g.o==='number'?g.o:100000+idx*10}));
  s.entries=d.entries.map((e,idx)=>{
    const o={id:String(e.id),tabId:String(e.tabId),groupId:e.groupId?String(e.groupId):null,fav:!!e.fav,favG:typeof e.favG==='boolean'?e.favG:!!e.fav,
      status:['active','archive','trash'].includes(e.status)?e.status:'active',
      o:typeof e.o==='number'?e.o:idx*10+10,favO:typeof e.favO==='number'?e.favO:null,bundle:e.bundle?String(e.bundle):null,created:+e.created||Date.now(),updated:+e.updated||Date.now(),
      keylist:lst(e.keylist),cmdlist:lst(e.cmdlist),attachments:Array.isArray(e.attachments)?e.attachments:[],meta:e.meta&&typeof e.meta==='object'?e.meta:null};
    FIELDS.forEach(([k])=>o[k]=typeof e[k]==='string'?e[k]:'');
    return o;
  });
  return s;
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){storageFailed=true}
  if(raw){
    try{const d=JSON.parse(raw);const er=validate(d,false);if(er)throw new Error(er);S=normalize(d);return}
    catch(e){try{localStorage.setItem(KEY+'_corrupt',raw)}catch(_){}corruptFound=true}
  }
  S=defaults();save();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));if(storageFailed){storageFailed=false;renderBanner()}return true}
  catch(e){storageFailed=true;renderBanner();return false}
}
const tab=id=>S.tabs.find(t=>t.id===id);
const grp=id=>S.groups.find(g=>g.id===id);
const get=id=>S.entries.find(e=>e.id===id);
const tabName=id=>tab(id)?tab(id).name:null;

/* ===== Действия с отменой ===== */
function act(fn,msg){
  const snap=JSON.stringify(S);
  fn();save();render();
  if(msg)toast(msg,()=>{const st=S.settings;S=JSON.parse(snap);S.settings=st;save();render()});
}
let toastT;
function toast(msg,undo){
  const t=$('#toast');t.innerHTML='';
  const s=document.createElement('span');s.textContent=msg;t.append(s);
  if(undo){const b=document.createElement('button');b.textContent='Отменить';b.onclick=()=>{hideToast();undo()};t.append(b)}
  t.style.display='flex';clearTimeout(toastT);toastT=setTimeout(hideToast,undo?7000:3500);
}
function hideToast(){$('#toast').style.display='none'}

/* ===== Модальные окна ===== */
function sheet({title,body,foot,guard,noHead,cls}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="sh-head"><h3></h3><button class="ibtn" data-x aria-label="Закрыть">✕</button></div><div class="sheet-body"></div><div class="sh-foot"></div></div>';
  if(noHead){$('.sh-head',ov).remove();$('.sheet',ov).insertAdjacentHTML('afterbegin','<button class="ibtn sh-x" data-x aria-label="Закрыть">✕</button>')}
  else $('h3',ov).textContent=title;
  if(cls)$('.sheet',ov).classList.add(cls);
  const bd=$('.sheet-body',ov);if(body)bd.append(body);
  bd.addEventListener('focusin',ev=>{
    if(window.matchMedia&&matchMedia('(max-width:699px)').matches&&ev.target.matches&&ev.target.matches('input,textarea,select'))
      setTimeout(()=>{try{ev.target.scrollIntoView({block:'center'})}catch(_){}},300);
  });
  const ft=$('.sh-foot',ov);if(foot)ft.append(...foot);
  const api={el:ov,body:bd,foot:ft,
    close(){ov.remove();stack=stack.filter(x=>x!==api);lockSync()},
    async tryClose(){if(guard&&!(await guard()))return;api.close()},
    setTitle(t){if($('h3',ov))$('h3',ov).textContent=t}};
  api.esc=()=>api.tryClose();
  ov.addEventListener('mousedown',e=>{if(e.target===ov)api.tryClose()});
  $('[data-x]',ov).onclick=()=>api.tryClose();
  stack.push(api);$('#modalRoot').append(ov);lockSync();return api;
}
function lockSync(){document.documentElement.classList.toggle('lock',stack.length>0)}
function dlg({title,text,html,node,buttons,noFocus}){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='ov center';
    ov.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true"><h3></h3><div class="dbody"></div><div class="dbtns"></div></div>';
    $('h3',ov).textContent=title;const b=$('.dbody',ov);
    if(text){const p=document.createElement('p');p.textContent=text;b.append(p)}
    if(html)b.insertAdjacentHTML('beforeend',html);
    if(node)b.append(node);
    const api={};
    const fin=v=>{ov.remove();stack=stack.filter(x=>x!==api);lockSync();res({v,el:b})};
    api.esc=()=>fin(null);
    buttons.forEach(bt=>{const x=document.createElement('button');x.className='btn '+(bt.kind||'');x.textContent=bt.label;x.onclick=()=>fin(bt.value);$('.dbtns',ov).append(x)});
    stack.push(api);$('#modalRoot').append(ov);lockSync();
    const f=noFocus?null:($('input,select',ov)||$('.btn.pri,.btn.dng',ov));if(f)f.focus();
  });
}
const info=(title,text)=>dlg({title,text,buttons:[{label:'Понятно',value:'ok',kind:'pri'}]});
async function ask(title,text,okLabel,danger){
  const r=await dlg({title,text,buttons:[{label:'Отмена',value:null},{label:okLabel,value:'ok',kind:danger?'dng':'pri'}]});
  return r.v==='ok';
}
async function promptName(title,val,ph){
  const el=document.createElement('div');
  el.innerHTML='<div class="fld"><input type="text" autocomplete="off"></div>';
  const inp=$('input',el);inp.value=val||'';inp.placeholder=ph||'';
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('.dbtns .pri').click()}});
  const r=await dlg({title,node:el,buttons:[{label:'Отмена',value:null},{label:'Сохранить',value:'ok',kind:'pri'}]});
  if(r.v!=='ok')return null;
  return inp.value.trim()||null;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&stack.length){e.preventDefault();stack[stack.length-1].esc()}
});
window.addEventListener('beforeunload',e=>{if(curDirty&&curDirty()){e.preventDefault();e.returnValue=''}});

/* ===== Перетаскивание ===== */
function makeSortable(box,sel,done){
  box.addEventListener('pointerdown',ev=>{
    const g=ev.target.closest('.grip');if(!g||!box.contains(g))return;
    const item=g.closest(sel);if(!item||item.parentElement!==box)return;
    const items=[...box.children].filter(c=>c.matches(sel));const n=items.length;if(n<2)return;
    ev.preventDefault();
    const from=items.indexOf(item),rects=items.map(i=>i.getBoundingClientRect());
    const step=from<n-1?rects[from+1].top-rects[from].top:rects[from].top-rects[from-1].top;
    const sc=box.closest('.sheet-body');const pos=()=>sc?sc.scrollTop:window.scrollY;
    const y0=ev.clientY,s0=pos();let y=y0,to=from,raf=0;
    try{g.setPointerCapture(ev.pointerId)}catch(_){}
    item.classList.add('drag');
    const upd=()=>{
      const dy=(y-y0)+(pos()-s0);item.style.transform='translateY('+dy+'px)';
      to=Math.max(0,Math.min(n-1,Math.round(from+dy/step)));
      items.forEach((it,j)=>{if(it===item)return;let s=0;
        if(from<to&&j>from&&j<=to)s=-step;else if(from>to&&j<from&&j>=to)s=step;
        it.style.transform=s?'translateY('+s+'px)':''});
    };
    const loop=()=>{
      let top=0,bot=innerHeight;if(sc){const r=sc.getBoundingClientRect();top=r.top;bot=r.bottom}
      const d=y<top+70?-12:y>bot-70?12:0;
      if(d){if(sc)sc.scrollTop+=d;else window.scrollBy(0,d)}
      upd();raf=requestAnimationFrame(loop);
    };
    const mv=e=>{y=e.clientY};
    const end=()=>{
      cancelAnimationFrame(raf);
      g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',end);g.removeEventListener('pointercancel',end);
      items.forEach(i=>{i.style.transform=''});item.classList.remove('drag');
      if(to!==from){const ids=items.map(i=>i.dataset.id);ids.splice(to,0,ids.splice(from,1)[0]);done(ids)}
    };
    g.addEventListener('pointermove',mv);g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
    loop();
  });
}
function reorderSubset(arr,ids){
  const set=new Set(ids),pos=[],map=new Map(arr.map(x=>[x.id,x]));
  arr.forEach((x,i)=>{if(set.has(x.id))pos.push(i)});
  ids.forEach((id,k)=>{arr[pos[k]]=map.get(id)});
}

/* ===== Поиск ===== */
const termsOf=s=>norm(s).replace(/\+/g,' ').split(/\s+/).filter(Boolean);
const listText=(e,k)=>(e[k]||[]).map(i=>i.a+' '+i.b).join('\n');
function matches(e,terms){
  const hay=norm(FIELDS.map(f=>e[f[0]]).concat([listText(e,'keylist'),listText(e,'cmdlist')]).join('\n')).replace(/\+/g,' ');
  return terms.every(t=>hay.includes(t));
}
function hl(text,terms){
  if(!terms.length)return esc(text);
  const re=new RegExp('('+terms.map(reEsc).join('|')+')','gi');
  return String(text).split(re).map((p,i)=>i%2?'<mark>'+esc(p)+'</mark>':esc(p)).join('');
}
function snippet(e,terms){
  if(!terms.length)return '';
  const ks=[['hotkey','Горячая клавиша'],['command','Команда'],['keylist','Список клавиш'],['cmdlist','Список команд'],['desc','Описание'],['steps','Инструкция'],['note','Примечание']];
  for(const [k,lab] of ks){
    let t=Array.isArray(e[k])?listText(e,k):e[k];if(!t)continue;
    t=plainFmt(t.replace(/\[\[([^\[\]\n]*)\]\]/g,'$1').replace(/`/g,''));
    const n=norm(t).replace(/\+/g,' ');
    const i=terms.map(x=>n.indexOf(x)).filter(x=>x>=0).sort((x,y)=>x-y)[0];
    if(i===undefined)continue;
    const st=Math.max(0,i-30);
    return '<div class="c-desc"><b>'+lab+':</b> '+(st?'…':'')+hl(t.slice(st,st+120).replace(/\s+/g,' '),terms)+'</div>';
  }
  return '';
}

/* ===== Отрисовка ===== */
const groupPath=id=>{const n=[];let g=grp(id),k=0;while(g&&k++<30){n.unshift(g.name);g=g.parentId?grp(g.parentId):null}return n.join(' › ')};
const locOf=e=>{
  const t=tabName(e.tabId)||(e.meta&&e.meta.tab)||'удалённая вкладка';
  const g=e.groupId?(grp(e.groupId)?groupPath(e.groupId):(e.meta&&e.meta.group)):null;
  return t+(g?' › '+g:'');
};

function keysHTML(h){
  return h.split(/\s*\+\s*/).filter(Boolean).map(k=>'<kbd>'+esc(k==='Plus'?'+':k)+'</kbd>').join('<span class="plus">+</span>');
}
/* [[Ctrl+B]] -> клавиши, `текст` -> команда */
function rich(text,nested,nc){
  if(!nested)text=text.replace(/^([ \t]*)[-•] (?=\S)/gm,'$1• ');
  const re=/\[\[([^\[\]\n]{1,60})\]\]|`([^`\n]{1,200})`|\*\*([^*\n]+?)\*\*|~~([^~\n]+?)~~|==([^=\n]+?)==|(?<![*\w])\*([^*\s][^*\n]*?)\*(?![*\w])|\{(\+{1,2}|-{1,2})([^\n]+?)\7\}/g;let out='',last=0,m;
  while((m=re.exec(text))){
    out+=esc(text.slice(last,m.index));
    if(m[1]!==undefined)out+=nc?keysHTML(m[1]):'<button type="button" class="cpyb" data-copy="'+esc(keysCopy(m[1]))+'" title="Нажмите, чтобы скопировать">'+keysHTML(m[1])+'</button>';
    else if(m[2]!==undefined)out+=nc?'<code class="ic">'+esc(m[2])+'</code>':'<button type="button" class="cpyb" data-copy="'+esc(m[2])+'" title="Нажмите, чтобы скопировать"><code class="ic">'+esc(m[2])+'</code></button>';
    else if(m[3]!==undefined)out+='<b>'+rich(m[3],1,nc)+'</b>';
    else if(m[4]!==undefined)out+='<s>'+rich(m[4],1,nc)+'</s>';
    else if(m[5]!==undefined)out+='<mark class="hlt">'+rich(m[5],1,nc)+'</mark>';
    else if(m[6]!==undefined)out+='<i>'+rich(m[6],1,nc)+'</i>';
    else out+='<span class="sz sz-'+(m[7][0]==='+'?'p':'m')+m[7].length+'">'+rich(m[8],1,nc)+'</span>';
    last=re.lastIndex;
  }
  return out+esc(text.slice(last));
}
function plainFmt(t){return t.replace(/\{(\+{1,2}|-{1,2})([^\n]+?)\1\}/g,'$2').replace(/\*\*([^*\n]+?)\*\*/g,'$1').replace(/~~([^~\n]+?)~~/g,'$1').replace(/==([^=\n]+?)==/g,'$1')}
function listSummary(e){
  const p=[];
  if((e.keylist||[]).length)p.push('Клавиш в списке: '+e.keylist.length);
  if((e.cmdlist||[]).length)p.push('Команд в списке: '+e.cmdlist.length);
  return p.join(' · ');
}
const firstLine=s=>(s||'').split('\n').find(x=>x.trim())||'';
const titleOf=e=>e.title||plainFmt(firstLine(e.command||e.desc||e.steps||e.note).replace(/\[\[([^\[\]\n]*)\]\]/g,'$1').replace(/`/g,'')).trim()||((e.keylist||[]).length?'Список клавиш':(e.cmdlist||[]).length?'Список команд':e.hotkey?'Горячая клавиша':'Без названия');

function cardPreview(e){
  const src=[['desc',e.desc],['steps',e.steps],['note',e.note]].find(x=>x[1]&&x[1].trim());
  if(!src)return '';
  let t=src[1].trim();
  // если названия нет и оно взято из этого же текста, первую строку не повторяем
  if(!e.title&&!e.command&&firstLine(t)===firstLine(e.desc||e.steps||e.note)){
    const rest=t.split('\n').slice(1).join('\n').trim();
    return rest;
  }
  return t;
}

  if(T.length)h+=snippet(e,T);else{const pv=cardPreview(e);if(pv)h+='<div class="c-desc">'+rich(pv,0,1)+'</div>'}

/* ===== Дерево: порядок записей и групп ===== */
function tabTree(tid){
  const gs=S.groups.filter(g=>g.tabId===tid&&g.status==='active'),gids=new Set(gs.map(g=>g.id));
  const map=new Map();
  const push=(p,it)=>{if(!map.has(p))map.set(p,[]);map.get(p).push(it)};
  S.entries.forEach((e,i)=>{if(e.tabId===tid&&e.status==='active')push(e.groupId&&gids.has(e.groupId)?e.groupId:'',{k:'e',x:e,i})});
  gs.forEach((g,i)=>push(g.parentId&&gids.has(g.parentId)?g.parentId:'',{k:'g',x:g,i:100000+i}));
  map.forEach(a=>a.sort((p,q2)=>((q2.k==='e'&&q2.x.fav?1:0)-(p.k==='e'&&p.x.fav?1:0))||(p.x.o-q2.x.o)||(p.i-q2.i)));
  return map;
}
const childrenOf=(tid,gid)=>tabTree(tid).get(gid||'')||[];
function nextO(tid,gid){const a=childrenOf(tid,gid);return a.length?Math.max(...a.map(i=>i.x.o))+10:10}
function maxO(){let m=0;S.entries.forEach(e=>{if(e.o>m)m=e.o});S.groups.forEach(g=>{if(g.o>m)m=g.o});return m}
function setOrder(ids){ids.forEach((id,i)=>{const it=get(id)||grp(id);if(it)it.o=(i+1)*10})}
function subtreeIds(gid){
  const ids=new Set([gid]);let ch=true;
  while(ch){ch=false;S.groups.forEach(g=>{if(g.parentId&&ids.has(g.parentId)&&!ids.has(g.id)){ids.add(g.id);ch=true}})}
  return ids;
}
function groupOptions(tid,excl){
  const gs=S.groups.filter(g=>g.tabId===tid&&g.status==='active'),ids=new Set(gs.map(g=>g.id));
  const kids=p=>gs.filter(g=>(g.parentId&&ids.has(g.parentId)?g.parentId:null)===p).sort((a,b)=>a.o-b.o);
  const out=[];
  const walk=(p,path,depth)=>kids(p).forEach(g=>{
    if(depth>30||(excl&&excl.has(g.id)))return;
    const lab=path?path+' › '+g.name:g.name;out.push({id:g.id,label:lab});walk(g.id,lab,depth+1);
  });
  walk(null,'',0);return out;
}
function moveItem(kind,id,gid,ref){
  const it=kind==='e'?get(id):grp(id);if(!it)return;
  if(kind==='g'&&gid&&subtreeIds(id).has(gid))return;
  const ids=childrenOf(it.tabId,gid||'').map(i=>i.x.id).filter(x=>x!==id);
  const at=ref?ids.indexOf(ref):-1;
  if(at<0)ids.push(id);else ids.splice(at,0,id);
  if(kind==='e')it.groupId=gid||null;else it.parentId=gid||null;
  setOrder(ids);
  if(gid){const g=grp(gid);if(g)g.collapsed=false}
}
function moveSibling(kind,id,d){
  const it=kind==='e'?get(id):grp(id);if(!it)return;
  let list=null;tabTree(it.tabId).forEach(a=>{if(a.some(i=>i.x.id===id))list=a});
  if(!list)return;
  const ids=list.map(i=>i.x.id),i=ids.indexOf(id),j=i+d;
  if(j<0||j>=ids.length)return;
  [ids[i],ids[j]]=[ids[j],ids[i]];setOrder(ids);save();render();
}
function fixRefs(){
  const gids=new Set(S.groups.map(g=>g.id));
  S.groups.forEach(g=>{if(g.parentId&&!gids.has(g.parentId))g.parentId=null;if(g.bundle&&!gids.has(g.bundle))g.bundle=null});
  S.entries.forEach(e=>{if(e.groupId&&!gids.has(e.groupId)&&e.status!=='trash')e.groupId=null;if(e.bundle&&!gids.has(e.bundle))e.bundle=null});
}

function countEnt(map,gid,seen){
  if(seen.has(gid))return 0;seen.add(gid);let n=0;
  (map.get(gid)||[]).forEach(it=>{n+=it.k==='e'?1:countEnt(map,it.x.id,seen)});
  return n;
}
function itemsHTML(map,gid,seen){

/* ===== Перетаскивание по дереву ===== */
function dropTarget(e,y,drag){
  if(!e)return undefined;
  const nextRef=item=>{let n=item.nextElementSibling;while(n&&(n===drag||!n.dataset.id))n=n.nextElementSibling;return n?n.dataset.id:null};
  const firstRef=box=>{const n=[...box.children].find(c=>c!==drag&&c.dataset.id);return n?n.dataset.id:null};
  let t;
  if((t=e.closest('.card'))){
    if(drag.contains(t))return null;
    const r=t.getBoundingClientRect(),gid=t.parentElement.dataset.gid||'';
    return y<r.top+r.height/2?{gid,ref:t.dataset.id,y:r.top,r}:{gid,ref:nextRef(t),y:r.bottom,r};
  }
  if((t=e.closest('.gh'))){
    const blk=t.parentElement;
    if(drag.contains(blk))return null;
    const r=t.getBoundingClientRect(),rel=(y-r.top)/(r.height||1),pg=blk.parentElement.dataset.gid||'';
    const gb=[...blk.children].find(c=>c.classList.contains('gb'));
    if(rel<.3)return {gid:pg,ref:blk.dataset.id,y:r.top,r};
    if(!gb&&rel>.7)return {gid:pg,ref:nextRef(blk),y:r.bottom,r};
    return {gid:blk.dataset.id,ref:gb?firstRef(gb):null,y:r.bottom,r,inside:t};
  }
  if((t=e.closest('.gempty'))){
    if(drag.contains(t))return null;
    const r=t.getBoundingClientRect();return {gid:t.dataset.gid,ref:null,y:r.bottom,r};
  }
  if((t=e.closest('.rootend'))){const r=t.getBoundingClientRect();return {gid:'',ref:null,y:r.top,r}}
  return undefined;
}
function initTreeDnD(){
  const main=$('#main');
  const line=document.createElement('div');line.className='dropline';document.body.append(line);
  main.addEventListener('pointerdown',ev=>{
    const grip=ev.target.closest('.grip');

    const el=grip.closest('.card,.gblock');if(!el)return;
    ev.preventDefault();
    const kind=el.dataset.kind,id=el.dataset.id;
    const multi=kind==='e'&&selMode&&sel.has(id)&&sel.size>1;
    const src=kind==='g'?el.querySelector('.gh'):el,rect=src.getBoundingClientRect();
    const ghost=src.cloneNode(true);ghost.classList.add('ghost');
    ghost.style.width=rect.width+'px';ghost.style.left=rect.left+'px';document.body.append(ghost);
    if(multi){ghost.dataset.n=sel.size;ghost.classList.add('multi');$$('.card',main).forEach(c=>{if(sel.has(c.dataset.id))c.classList.add('dragging')})}
    const offY=ev.clientY-rect.top;let x=ev.clientX,y=ev.clientY,target=null,raf=0,hi=null;
    try{grip.setPointerCapture(ev.pointerId)}catch(_){}
    el.classList.add('dragging');
    const clearHi=()=>{if(hi){hi.classList.remove('dropin');hi=null}};
    const upd=()=>{
      ghost.style.top=(y-offY)+'px';
      const t=dropTarget(document.elementFromPoint(x,y),y,el);
      if(t!==undefined)target=t;
      clearHi();
      if(target){
        line.style.display='block';line.style.left=(target.r.left+(target.inside?14:0))+'px';
        line.style.width=(target.r.width-(target.inside?14:0))+'px';line.style.top=(target.y-1)+'px';
        if(target.inside){hi=target.inside;hi.classList.add('dropin')}
      }else line.style.display='none';
    };
    const loop=()=>{const d=y<80?-14:y>innerHeight-80?14:0;if(d)window.scrollBy(0,d);upd();raf=requestAnimationFrame(loop)};
    const mv=e=>{x=e.clientX;y=e.clientY};
    const end=e2=>{
      cancelAnimationFrame(raf);
      grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',end);grip.removeEventListener('pointercancel',end);
      ghost.remove();line.style.display='none';clearHi();$$('.dragging').forEach(c=>c.classList.remove('dragging'));
      if(e2.type==='pointercancel'||!target)return;
      if(multi){
        const ids=orderedSel().filter(x=>x.status==='active').map(x=>x.id),np=target.gid||'';
        const sibs=childrenOf(curTab,np).map(i=>i.x.id);let ref=target.ref;
        while(ref&&sel.has(ref)){const k=sibs.indexOf(ref);ref=k>=0&&k+1<sibs.length?sibs[k+1]:null}
        act(()=>{ids.forEach(x=>moveItem('e',x,np||null,ref))},'Перенесено записей: '+ids.length);
        return;
      }
      const it=kind==='e'?get(id):grp(id);if(!it)return;
      const oldP=(kind==='e'?it.groupId:it.parentId)||'',newP=target.gid||'';
      if(kind==='g'&&newP&&subtreeIds(id).has(newP))return;
      act(()=>moveItem(kind,id,newP||null,target.ref),oldP!==newP?(kind==='g'?'Группа перенесена':'Запись перенесена'):null);
    };
    grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);
    loop();
  });
}

function bundleItems(gid,st){
  const ids=new Set([gid]);let ch=true;
  while(ch){ch=false;S.groups.forEach(g=>{if(g.status===st&&g.parentId&&ids.has(g.parentId)&&!ids.has(g.id)){ids.add(g.id);ch=true}})}
  return {groups:S.groups.filter(g=>ids.has(g.id)&&g.status===st),entries:S.entries.filter(e=>e.groupId&&ids.has(e.groupId)&&e.status===st)};
}
function tagBundle(gid,st){
  const g=grp(gid),{groups,entries}=bundleItems(gid,'active');
  const meta={tab:tabName(g.tabId),parent:g.parentId?groupPath(g.parentId):null};
  groups.forEach(x=>{x.status=st;x.bundle=gid});
  entries.forEach(e=>{e.status=st;e.bundle=gid;e.meta={tab:tabName(e.tabId),group:groupPath(e.groupId)}});
  g.meta=meta;
}

  bAll.onclick=async()=>{if(await restoreGroup(gid))sh.close()};
}
async function restoreSelected(gid,ids,gids){
  const g=grp(gid);if(!g)return false;
  const es=(ids||[]).map(get).filter(Boolean),gs=(gids||[]).map(grp).filter(Boolean);
  if(!es.length&&!gs.length)return false;
  const parts=[];
  if(es.length)parts.push(es.length+' '+pl(es.length,['запись','записи','записей']));
  if(gs.length)parts.push(gs.length+' '+pl(gs.length,['подгруппа','подгруппы','подгрупп']));
  const pg=g.parentId?grp(g.parentId):null,tabOk=!!tab(g.tabId);
  const defGroup=pg&&pg.status==='active'&&pg.tabId===g.tabId?pg.id:null;
  let d={newTab:true};
  if(S.tabs.length){
    d=await pickDest('Куда восстановить?','Группа «'+g.name+'» остаётся в '+(g.status==='trash'?'корзине':'архиве')+'. Выберите, куда вернуть: '+parts.join(' и ')+'.',tabOk?g.tabId:null,defGroup);
    if(!d)return false;
  }
  act(()=>{
    if(d.newTab){const t={id:uid(),name:(g.meta&&g.meta.tab)||'Восстановленное'};S.tabs.push(t);d={tabId:t.id,groupId:null};curTab=t.id}
    let o=nextO(d.tabId,d.groupId);
    gs.forEach(x=>{
      const sub=subtreeIds(x.id);
      S.groups.forEach(y=>{if(sub.has(y.id)&&y.bundle===gid){y.status='active';y.bundle=null;y.tabId=d.tabId;y.meta=null}});
      S.entries.forEach(e=>{if(e.groupId&&sub.has(e.groupId)&&e.bundle===gid){e.status='active';e.bundle=null;e.meta=null;e.tabId=d.tabId}});
      x.parentId=d.groupId;x.o=o;o+=10;
    });
    es.forEach(e=>{e.tabId=d.tabId;e.groupId=d.groupId;e.status='active';e.bundle=null;e.meta=null;e.o=o;o+=10});
    if(d.groupId){const p=grp(d.groupId);if(p)p.collapsed=false}
  },'Восстановлено: '+parts.join(', '));
  return true;
}

const HK_CATS=[['mod','Ctrl · Shift'],['let','Буквы'],['num','Цифры'],['fn','F1–F12'],['spec','Спец.'],['sym','Знаки'],['mouse','Мышь']];
const HK={

const HK_ALL=[].concat(...Object.values(HK));
function splitCombo(text){
  let t=String(text).trim().replace(/^\[\[|\]\]$/g,'').replace(/^[`"“«']+|[`"”»']+$/g,'').trim();
  if(t.includes('+')){t=t.replace(/\+\s*\+/g,'+Plus');return t.split(/\s*\+\s*/).map(x=>x.trim())}

}
function hotkeyWidget(initial,onChange,collapsible){

  const canon=i=>{
    const v=(keys[i]||'').trim();if(!v)return;

    const inp=$$('.slot input',slots)[i];if(inp)inp.value=keys[i];
  };
  const cn=v=>{v=v.trim();const f=HK_ALL.find(x=>x.toLowerCase()===v.toLowerCase());return f||(v.length===1?v.toUpperCase():v)};
  const distribute=(text,start,replace)=>{
    const parts=splitCombo(text);
    if(replace)keys.length=start;
    let idx=start;
    for(const p of parts){if(idx>=6)break;while(keys.length<=idx)keys.push('');if(p)keys[idx]=cn(p);idx++}
    while(keys.length<2)keys.push('');
    const lastEmpty=parts[parts.length-1]==='';
    act=lastEmpty?Math.min(idx-1,keys.length-1):Math.min(idx,keys.length-1);
    if(!lastEmpty&&idx>=keys.length)act=keys.length-1;

  };

      const inp=$('input',w);inp.value=k;
      inp.addEventListener('focus',()=>{act=i;markAct();drawChips()});

      inp.addEventListener('keydown',ev=>{
        if(ev.key!=='Enter')return;
        ev.preventDefault();
        const v=(keys[i]||'').trim().toLowerCase();
        if(v&&!HK_ALL.some(x=>x.toLowerCase()===v)){const m=HK_ALL.find(x=>x.toLowerCase().startsWith(v));if(m)keys[i]=m}
        canon(i);

        $$('.slot input',slots)[act].focus();
      });
      $('.x',w).onclick=()=>{if(i>=2)keys.splice(i,1);else keys[i]='';act=Math.min(i,keys.length-1);drawSlots();drawChips();onChange()};

    });

  };
  const drawChips=()=>{
    const typed=(keys[act]||'').trim().toLowerCase();
    const exact=HK_ALL.some(x=>x.toLowerCase()===typed);
    let list,cats=true;
    if(typed&&!exact){list=HK_ALL.filter(x=>x.toLowerCase().startsWith(typed)).slice(0,30);cats=false}else list=HK[cat];
    $('.hk-cats',el).innerHTML=cats?HK_CATS.map(([c,l])=>'<button type="button" class="seg'+(c===cat?' on':'')+'" data-c="'+c+'">'+l+'</button>').join(''):'<span class="hint">Подсказки по набранному:</span>';

  };
  el.addEventListener('click',ev=>{
    const c=ev.target.closest('[data-c]'),k=ev.target.closest('[data-k]'),a=ev.target.closest('[data-add]');
    if(c){cat=c.dataset.c;drawChips()}
    else if(a){keys.push('');act=keys.length-1;cat='let';drawSlots();drawChips()}
    else if(k){
      keys[act]=k.dataset.k;
      if(act<keys.length-1){act++;cat=act===keys.length-1?'let':'mod'}
      drawSlots();drawChips();onChange();
    }
  });
  drawSlots();drawChips();
  return {el,get:()=>keys.map(x=>x.trim()).filter(Boolean).join('+')};
}

const KEYCHAIN=/(?<![\w\[`])(?:(?:Ctrl|Control|Ctl|Alt|Shift|Win|Cmd|Meta)\s*\+\s*)+(?:F\d{1,2}|Enter|Esc|Escape|Tab|Space|Del|Delete|Backspace|Home|End|PgUp|PgDn|Insert|[A-Za-z0-9])(?![\w\]])/gi;

function fmtText(ta,k){

function normKeys(s){

const KEYLIKE=k=>!!k&&k.split('+').every(x=>{x=x.trim();return x.length===1||/^f\d{1,2}$/i.test(x)||HK_ALL.some(h=>h.toLowerCase()===x.toLowerCase())});

function parseKeyLines(text,order){

    const l=stripBullet(raw);if(!l)return;

      if(order==='kd'){if(KEYLIKE(first))kd()}
      else if(order==='dk'){if(tk.length>1&&KEYLIKE(last))dk();else if(KEYLIKE(first))kd()}
      else{
        if(KSTRICT(first))kd();
        else if(tk.length>1&&KSTRICT(last))dk();
        else if(KEYLIKE(first))kd();
      }
      if(!done){k=cleanKey(l);d=''}

function parseCmdLines(text){
  const out=[];

    const l=stripBullet(raw);if(!l)return;
    let c=l,d='';const tab=l.indexOf('\t');

    else if(b.dataset.r==='pick'){const inp=$('.a',r);const k=await pickKeys(inp.value,'Выбор клавиш','Готово');if(k!==null)inp.value=k}
  });
  el.addEventListener('change',ev=>{if(isK&&ev.target.classList.contains('a'))ev.target.value=normKeys(ev.target.value)});
  el.addEventListener('keydown',ev=>{
    if(ev.key!=='Enter'||ev.ctrlKey||ev.metaKey)return;
    const t=ev.target;if(!t.matches('.a,.b'))return;ev.preventDefault();
    const r=t.closest('.le-row');
    if(t.classList.contains('a'))$('.b',r).focus();else add('','',true,r);
  });
  return {el,get:getRows};
}

/* ===== Экспорт / импорт / резервная копия ===== */
function doExport(){
  const now=new Date(),p=n=>String(n).padStart(2,'0');
  const stamp=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+'_'+p(now.getHours())+'-'+p(now.getMinutes());
  const d={app:'tech-base',format:1,appVersion:APP_VERSION,exportedAt:now.toISOString(),tabs:S.tabs,groups:S.groups,entries:S.entries};
  const blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='моя-техническая-база_'+stamp+'.json';
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  S.settings.lastExport=Date.now();save();render();
  toast('Файл экспорта сформирован. Он в папке «Загрузки».');
}
function entryText(e){
  const clean=t=>plainFmt(t.replace(/\[\[([^\[\]\n]*)\]\]/g,'[$1]'));
  const ind=(t,n)=>t.split('\n').map(x=>' '.repeat(n)+x).join('\n');
  const L=['■ '+titleOf(e)];
  if(e.hotkey)L.push('  Горячая клавиша: '+e.hotkey);
  if(e.command)L.push(e.command.includes('\n')?'  Команда:\n'+ind(e.command,4):'  Команда: '+e.command);
  if((e.keylist||[]).length){L.push('  Горячие клавиши:');e.keylist.forEach(i=>L.push('    '+i.a+(i.b?' — '+i.b:'')))}
  if((e.cmdlist||[]).length){L.push('  Команды:');e.cmdlist.forEach(i=>L.push('    '+i.a+(i.b?' — '+i.b:'')))}
  [['desc','Описание'],['steps','Инструкция'],['note','Примечание']].forEach(([k,l])=>{if(e[k]){L.push('  '+l+':');L.push(ind(clean(e[k]),4))}});
  return L.join('\n');
}
function buildText(tabs){
  const bar='='.repeat(60);let n=0;const body=[];
  tabs.forEach(t=>{
    const map=tabTree(t.id),cnt=S.entries.filter(e=>e.tabId===t.id&&e.status==='active').length;
    if(!cnt)return;
    n+=cnt;body.push(bar+'\n'+t.name+'\n'+bar+'\n');
    const hasG=S.groups.some(g=>g.tabId===t.id&&g.status==='active');
    let last=null;
    const walk=(gid,seen)=>(map.get(gid)||[]).forEach(it=>{
      if(it.k==='e'){
        if(last!==gid){if(gid||hasG)body.push(gid?'--- Группа: '+groupPath(gid)+' ---\n':'--- Без группы ---\n');last=gid}
        body.push(entryText(it.x)+'\n');
      }else if(!seen.has(it.x.id)){seen.add(it.x.id);walk(it.x.id,seen)}
    });
    walk('',new Set());
  });
  return {n,text:body.join('\n')};
}

function importMerge(d){
  const imp=normalize(d,S.settings);const c={t:0,g:0,e:0,x:0,s:0};
  const snap=JSON.stringify(S);
  act(()=>{
    S.settings.lastImport=Date.now();

    imp.groups.forEach(g=>{
      const ex=grp(g.id);
      if(ex&&ex.tabId===tm[g.tabId]){gm[g.id]=ex.id;return}
      const n=Object.assign({},g,{tabId:tm[g.tabId]||g.tabId,o:baseO+(g.o||0)});

    });

    });

        if(FIELDS.every(([k])=>ex[k]===e[k])&&JSON.stringify(ex.keylist)===JSON.stringify(e.keylist)&&JSON.stringify(ex.cmdlist)===JSON.stringify(e.cmdlist)){c.s++;return}
        n.id=uid();n.title=(e.title||titleOf(e))+' (импорт)';n.fav=false;c.x++;

}

  const clr=()=>{if(lp){clearTimeout(lp.t);lp=null}};
  main.addEventListener('pointerdown',ev=>{
    lpFired=false;clr();
    if(selMode||reorder||favOrd||ev.button>0)return;
    const card=ev.target.closest('.card[data-id]');
    if(!card||ev.target.closest('button,.grip,input,a'))return;
    lp={x:ev.clientX,y:ev.clientY,t:setTimeout(()=>{lp=null;lpFired=true;enterSel(card.dataset.id)},550)};
  });
  main.addEventListener('pointermove',ev=>{if(lp&&Math.hypot(ev.clientX-lp.x,ev.clientY-lp.y)>8)clr()});
  ['pointerup','pointercancel'].forEach(t=>main.addEventListener(t,clr));
  window.addEventListener('scroll',clr,{passive:true});
  main.addEventListener('contextmenu',ev=>{if(lp||lpFired)ev.preventDefault()});
})();

function lset(){const st=S.settings;if(!st.look||typeof st.look!=='object')st.look={};const L=st.look;for(const k in LOOK_DEF)if(typeof L[k]!=='string')L[k]=LOOK_DEF[k];if(!/^#[0-9a-f]{6}$/i.test(L.custom))L.custom=LOOK_DEF.custom;return L}
function lum(hex){const c=[1,3,5].map(i=>parseInt(hex.substr(i,2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function applyLook(){
  const L=lset(),root=document.documentElement;
  let sysDark=false;try{sysDark=!!(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)}catch(e){}
  const th=L.theme==='auto'?(sysDark?'dark':'light'):(PAL[L.theme]?L.theme:'light'),dk=DARKTH.includes(th);
  const v=Object.assign({},PAL[th]);
  if(L.tint!=='none'&&(th==='light'||th==='dark')){
    const t=TINTS.find(x=>x[0]===L.tint);
    if(t){const h=t[2];
      v.bg='hsl('+h+',16%,'+(dk?9:93)+'%)';v.surf='hsl('+h+',16%,'+(dk?13:99)+'%)';
      v.line='hsl('+h+',14%,'+(dk?22:83)+'%)';v.key='hsl('+h+',16%,'+(dk?16:96)+'%)'}
  }
  let acc;
  if(L.accent==='custom')acc=L.custom;
  else{const a=ACCENTS.find(x=>x[0]===L.accent)||ACCENTS[0];acc=dk?a[3]:a[2]}
  v.acc=acc;v.accink=lum(acc)>0.4?'#0C1620':'#ffffff';
  for(const k in v)root.style.setProperty('--'+k,v[k]);
  root.style.colorScheme=dk?'dark':'light';
  const sz=(SIZES.find(x=>x[0]===L.size)||SIZES[1])[2];root.style.fontSize=sz+'px';
  const ks=Math.max(0,Math.min(KBS.length-1,+L.kbs||0)),kc=KBC[Math.max(0,Math.min(KBC.length-1,(+L.kbc||1)-1))][1];
  root.style.setProperty('--kb-fs',(0.82*KBS[ks]/ KBS[2]*1).toFixed(3)+'rem');
  const cs=Math.max(0,Math.min(KBS.length-1,+L.cms||0)),cc=CMC[Math.max(0,Math.min(CMC.length-1,(+L.cmc||1)-1))][1];
  root.style.setProperty('--cm-k',(KBS[cs]/KBS[2]).toFixed(3));
  root.style.setProperty('--cm-ct',cc.ct);root.style.setProperty('--cm-tx',cc.tx);root.style.setProperty('--cm-bd',cc.bd);root.style.setProperty('--cm-bw',cc.bw);root.style.setProperty('--cm-fw',cc.fw);
  root.style.setProperty('--cl',CLS.some(x=>x[0]===L.cl)?L.cl:'3');
  root.style.setProperty('--cpad',((CDS.find(x=>x[0]===L.cd)||CDS[1])[2])+'px');
  applyWidths();
  root.style.setProperty('--kb-bd',kc.bd);root.style.setProperty('--kb-bw',kc.bw);root.style.setProperty('--kb-fw',kc.fw);root.style.setProperty('--kb-tx',kc.tx);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',acc);
}

/* ===== Автоматические копии ===== */
const AUTO_EVERY=[['hour','Не чаще раза в час при запуске',36e5],['day','Раз в день',864e5],['week','Раз в неделю',6048e5],['off','Выключено',0]];
function autoCfg(){const st=S.settings;if(!st.auto||typeof st.auto!=='object')st.auto={};const c=st.auto;if(!AUTO_EVERY.some(x=>x[0]===c.every))c.every='day';if(![3,5,10,20].includes(c.keep))c.keep=5;if(typeof c.last!=='number')c.last=0;return c}
function readAuto(){try{const a=JSON.parse(localStorage.getItem(AKEY));return Array.isArray(a)?a.filter(x=>x&&typeof x.at==='number'&&x.data&&!validate(x.data,false)):[]}catch(e){return[]}}
function writeAuto(a){a=a.slice();while(a.length){try{localStorage.setItem(AKEY,JSON.stringify(a));return true}catch(e){a.pop()}}try{localStorage.removeItem(AKEY)}catch(e){}return false}
const coreData=()=>({app:'tech-base',format:1,tabs:S.tabs,groups:S.groups,entries:S.entries});
let fsNeedPerm=false;
function autoBackup(force){
  const c=autoCfg();
  if(!force){const ev=AUTO_EVERY.find(x=>x[0]===c.every);if(!ev||c.every==='off'||Date.now()-c.last<ev[2])return false}
  const list=readAuto(),cur=JSON.stringify(coreData());
  let made=false;
  if(!list.length||JSON.stringify(list[0].data)!==cur){
    list.unshift({at:Date.now(),data:JSON.parse(cur)});
    while(list.length>c.keep)list.pop();
    made=writeAuto(list);
  }
  c.last=Date.now();save();
  fsBackup().catch(()=>{});
  return made;
}
async function restoreAuto(i){
  const a=readAuto()[i];if(!a)return;
  if(!await ask('Восстановить копию от '+fmt(a.at)+'?','Текущая база будет заменена. Перед этим она сохранится в «резервную копию перед заменой», поэтому действие можно повернуть назад из «Настроек».','Восстановить',true))return;
  const cur=S;
  if(!makeBackup())return info('Восстановление не выполнено','Не удалось сохранить текущую базу. Данные не тронуты.');
  S=normalize(a.data,cur.settings);
  if(!save()){S=cur;return info('Восстановление не выполнено','Не удалось записать данные в браузер.')}
  curTab=S.tabs.some(t=>t.id===curTab)?curTab:(S.tabs[0]?S.tabs[0].id:null);view='tab';selMode=false;sel.clear();render();
  toast('База восстановлена из автоматической копии');
}
/* копии в папку на компьютере (Chrome на ПК) */
const FS_OK=()=>typeof window.showDirectoryPicker==='function'&&!!window.indexedDB;
function idb(fn){return new Promise((res,rej)=>{const r=indexedDB.open('techbase_fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('h','readwrite'),q=fn(tx.objectStore('h'));tx.oncomplete=()=>{db.close();res(q&&q.result)};tx.onerror=()=>rej(tx.error)}})}
async function fsHandle(){if(!FS_OK())return null;try{return await idb(st=>st.get('dir'))||null}catch(e){return null}}
async function fsBackup(){
  const h=await fsHandle();if(!h)return 'none';
  let pm=await h.queryPermission({mode:'readwrite'});
  if(pm!=='granted'){fsNeedPerm=true;return 'perm'}
  fsNeedPerm=false;
  const c=autoCfg(),n=new Date(),p=x=>String(x).padStart(2,'0');
  const name='моя-техническая-база_авто_'+n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'.json';
  const f=await h.getFileHandle(name,{create:true}),w=await f.createWritable();
  await w.write(JSON.stringify(Object.assign({appVersion:APP_VERSION,exportedAt:n.toISOString()},coreData()),null,1));await w.close();
  const names=[];for await(const [nm] of h.entries())if(/^моя-техническая-база_авто_\d{4}-\d{2}-\d{2}\.json$/.test(nm))names.push(nm);
  names.sort();while(names.length>c.keep){try{await h.removeEntry(names.shift())}catch(e){break}}
  return 'ok';
}
document.addEventListener('click',async()=>{
  if(!fsNeedPerm)return;fsNeedPerm=false;
  try{const h=await fsHandle();if(h&&await h.requestPermission({mode:'readwrite'})==='granted')await fsBackup()}catch(e){}
},{capture:true});
async function openAutoMenu(){
  const c=autoCfg(),el=document.createElement('div');
  let fsName=null;try{const h=await fsHandle();fsName=h?h.name:null}catch(e){}
  const draw=()=>{
    const list=readAuto();
    el.innerHTML='<p class="hint">Программа сама хранит несколько последних копий внутри браузера. Копия создаётся при запуске и при возврате в программу, если с прошлой копии прошло достаточно времени и данные изменились. Это защита от случайной порчи данных, но не от очистки данных браузера: файл экспорта всё равно нужно хранить вне браузера.</p>'+
      '<div class="fld"><label>Как часто</label><select data-ev>'+AUTO_EVERY.map(([k,l])=>'<option value="'+k+'"'+(c.every===k?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'+
      '<div class="fld"><label>Сколько копий хранить</label><select data-kp>'+[3,5,10,20].map(n=>'<option value="'+n+'"'+(c.keep===n?' selected':'')+'>'+n+'</option>').join('')+'</select></div>'+
      '<button class="btn" data-now>Создать копию сейчас</button>'+
      '<div class="vh">Сохранённые копии ('+list.length+')</div>'+
      (list.length?list.map((a,i)=>'<div class="acopy"><span>'+esc(fmt(a.at))+'<small>'+a.data.entries.length+' '+pl(a.data.entries.length,['запись','записи','записей'])+', вкладок: '+a.data.tabs.length+'</small></span><button class="btn sm" data-rs="'+i+'">Восстановить</button></div>').join(''):'<p class="hint">Копий пока нет.</p>')+
      (FS_OK()?'<div class="vh">Копии в папку на компьютере</div><p class="hint">'+(fsName?'Папка: «'+esc(fsName)+'». Раз в день в неё записывается файл с датой в имени, хранится столько файлов, сколько указано выше.'+(fsNeedPerm?' Браузеру нужно подтвердить доступ: он запросит его при ближайшем нажатии.':''):'Папка не выбрана. Если выбрать её, копии будут появляться там как обычные файлы. Работает в Chrome на компьютере.')+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-dir>'+(fsName?'Сменить папку':'Выбрать папку')+'</button>'+(fsName?'<button class="btn" data-nodir>Отключить</button>':'')+'</div>':'<p class="hint">Копии в папку доступны только в Chrome на компьютере. На телефоне пользуйтесь экспортом в файл.</p>');
  };
  draw();
  const sh=sheet({title:'Автоматические копии',body:el});
  el.addEventListener('change',e=>{
    if(e.target.matches('[data-ev]')){c.every=e.target.value;save()}
    else if(e.target.matches('[data-kp]')){c.keep=+e.target.value;const l=readAuto();if(l.length>c.keep)writeAuto(l.slice(0,c.keep));save();draw()}
  });
  el.addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-now')){const m=autoBackup(true);toast(m?'Копия создана':'Данные не менялись с прошлой копии');draw()}
    else if(b.dataset.rs!=null){sh.close();restoreAuto(+b.dataset.rs)}
    else if(b.hasAttribute('data-dir')){
      try{const h=await window.showDirectoryPicker({mode:'readwrite'});await idb(st=>st.put(h,'dir'));fsName=h.name;fsNeedPerm=false;await fsBackup();toast('Папка выбрана, первая копия записана')}catch(err){if(err&&err.name!=='AbortError')info('Папка не выбрана','Браузер не дал доступ к этой папке. Выберите другую, например созданную специально для копий.')}
      draw();
    }else if(b.hasAttribute('data-nodir')){try{await idb(st=>st.delete('dir'))}catch(_){}fsName=null;fsNeedPerm=false;draw()}
  });
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S)try{autoBackup(false)}catch(e){}});
setInterval(()=>{try{if(S)autoBackup(false)}catch(e){}},30*60*1000);

/* ===== Обновление программы (PWA) ===== */
let swReg=null,swWaiting=null,swReloading=false;
function showUpdate(){
  const b=$('#updbar');if(!b)return;
  b.innerHTML='<span>Доступна новая версия</span><button class="btn sm" data-u="go">Обновить</button><button class="btn sm" data-u="later" aria-label="Позже">✕</button>';
  b.hidden=false;
}
async function applyUpdate(){
  if(!swWaiting)return;
  if(curDirty&&curDirty()&&!await ask('Обновить сейчас?','В открытой форме есть несохранённые изменения, при обновлении они потеряются.','Обновить',true))return;
  swWaiting.postMessage({type:'SKIP_WAITING'});
  setTimeout(()=>{if(!swReloading){swReloading=true;location.reload()}},4000);
}
$('#updbar').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-u]');if(!b)return;
  if(b.dataset.u==='go')applyUpdate();else $('#updbar').hidden=true;
});
function watchSW(reg){
  const mark=w=>{if(navigator.serviceWorker.controller){swWaiting=w;showUpdate()}};
  if(reg.waiting)mark(reg.waiting);
  reg.addEventListener('updatefound',()=>{
    const nw=reg.installing;if(!nw)return;
    nw.addEventListener('statechange',()=>{if(nw.state==='installed')mark(nw)});
  });
}
async function checkUpdate(){
  if(!swReg)return info('Проверка недоступна','Обновления проверяются в установленной версии приложения (по адресу https). В этом режиме программа обновляется только заменой файла. Текущая версия: '+APP_VERSION+'.');
  if(swWaiting){showUpdate();return}
  toast('Проверяю обновление…');
  try{await swReg.update()}catch(e){return info('Нет связи','Не удалось проверить обновление. Проверьте подключение к интернету. Текущая версия: '+APP_VERSION+'.')}
  const t0=Date.now();
  while(!swWaiting&&swReg.installing&&Date.now()-t0<20000)await new Promise(r=>setTimeout(r,300));
  if(swReg.waiting&&!swWaiting){swWaiting=swReg.waiting}
  if(swWaiting)showUpdate();
  else info('Обновлений нет','У вас последняя версия: '+APP_VERSION+'.');
}
(function(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swReloading)return;swReloading=true;location.reload()});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;watchSW(reg);reg.update().catch(()=>{})}).catch(()=>{});
  });
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&swReg)swReg.update().catch(()=>{})});
})();
/* после обновления сообщаем версию */
try{
  const pv=localStorage.getItem('techbase_seen_ver');
  if(pv&&pv!==APP_VERSION)setTimeout(()=>toast('Приложение обновлено до версии '+APP_VERSION),600);
  localStorage.setItem('techbase_seen_ver',APP_VERSION);
}catch(e){}

/* ===== Запуск ===== */
initTreeDnD();
(function(){
  const v=window.visualViewport;if(!v)return;
  const r=document.documentElement.style;
  const f=()=>{
    if(v.scale>1.01)return;
    r.setProperty('--vvh',v.height+'px');r.setProperty('--vvt',v.offsetTop+'px');
    const a=document.activeElement;
    if(a&&a.matches&&a.matches('.sheet-body input,.sheet-body textarea,.sheet-body select'))setTimeout(()=>{try{a.scrollIntoView({block:'center'})}catch(_){}},60);
  };
  f();v.addEventListener('resize',f);v.addEventListener('scroll',f);
})();
load();
applyLook();
curTab=(S.tabs.find(t=>t.id===S.settings.lastTab)||S.tabs[0]||{}).id||null;
render();
try{autoBackup(false)}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if(corruptFound)info('Данные не прочитаны','Сохранённая база в браузере оказалась повреждена. Её копия отложена отдельно, приложение запущено с чистой базой. Если у вас есть файл экспорта, импортируйте его.');
if(storageFailed)renderBanner();
</script>
